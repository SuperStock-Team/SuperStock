<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario | SuperStock</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="">
  <header class="encabezado">
    <div class="encabezado__contenido">
      <a href="index.html" class="marca"><span class="marca__logo"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 10h9.2L19 7H6.2M9 19a1 1 0 100 .01M17 19a1 1 0 100 .01"/></svg></span>SuperStock</a>
      <nav class="menu" aria-label="Principal">
        <a href="index.html" class="menu__enlace">Inicio</a>
        <a href="productos.html" class="menu__enlace menu__enlace--activo">Productos</a>
        <a href="registrar-producto.html" class="boton boton--primario boton--pequeno"><span aria-hidden="true">+</span><span class="menu__nuevo"> Nuevo</span></a>
      </nav>
    </div>
  </header>
  <main class="contenedor">
    <h1 class="titulo-pagina">Inventario</h1>
    <p class="subtitulo-pagina">Gestiona los productos registrados en el supermercado.</p>
    <div class="barra-herramientas">
      <label class="buscador"><span class="visualmente-oculto">Buscar productos</span><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg><input type="search" id="buscador" placeholder="Buscar por nombre, código, categoría…"></label>
      <a href="registrar-producto.html" class="boton boton--primario boton--ancho-movil">+ Nuevo producto</a>
    </div>
    <div class="tabla-contenedor">
      <table class="tabla">
        <thead>
          <tr><th>Producto</th><th>Código</th><th>Categoría</th><th>Precio</th><th>Stock</th><th class="th-acciones">Acciones</th></tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>
    <p id="mensaje-vacio" class="subtitulo-pagina" hidden>No hay productos para mostrar.</p>
  </main>
    <div class="modal-fondo" id="modal-eliminar" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <span class="modal__icono"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17v.01"/></svg></span>
      <h2 id="modal-titulo" class="modal__titulo">¿Eliminar producto?</h2>
      <p class="modal__texto">Vas a eliminar <strong id="modal-nombre-producto"></strong>. Esta acción no se puede deshacer.</p>
      <div class="modal__botones">
        <button type="button" class="boton boton--secundario" id="modal-cancelar">Cancelar</button>
        <button type="button" class="boton boton--peligro" id="modal-confirmar">Sí, eliminar</button>
      </div>
    </div>
  </div>
  <script src="js/almacenamiento.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/formato.js"></script>
  <script src="js/vista-listado.js"></script>
</body>
</html>
