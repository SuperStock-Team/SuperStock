<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del producto | SuperStock</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__contenido">
      <a href="index.html" class="marca"><span class="marca__logo"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 10h9.2L19 7H6.2M9 19a1 1 0 100 .01M17 19a1 1 0 100 .01"/></svg></span>SuperStock</a>
      <nav class="menu" aria-label="Principal">
        <a href="index.html" class="menu__enlace">Inicio</a>
        <a href="productos.html" class="menu__enlace menu__enlace--activo">Productos</a>
        <a href="registrar-producto.html" class="boton boton--primario boton--pequeno"><span aria-hidden="true">+</span><span class="menu__nuevo"> Nuevo</span></a>
      </nav>
    </div>
  </header>
  <main class="contenedor">
    <h1 class="titulo-pagina">Detalle del producto</h1>
    <p class="subtitulo-pagina">Información completa y código de barras.</p>

    <p id="mensaje-no-encontrado" class="subtitulo-pagina" hidden>
      No se encontró el producto. <a href="productos.html" class="enlace-volver">Volver al listado</a>
    </p>

    <div class="detalle" id="contenido-detalle">
      <section class="panel">
        <div class="detalle__cabecera">
          <h2 class="detalle__nombre" id="detalle-nombre"></h2>
          <span id="detalle-estado" class="etiqueta"></span>
        </div>
        <p class="subtitulo-pagina" id="detalle-descripcion"></p>
        <p class="detalle__precio"><span id="detalle-precio"></span> <span class="texto-suave" id="detalle-unidad"></span></p>
        <dl class="detalle__datos">
          <div class="detalle__fila"><dt>Código de barras</dt><dd id="detalle-codigo"></dd></div>
          <div class="detalle__fila"><dt>Categoría</dt><dd id="detalle-categoria"></dd></div>
          <div class="detalle__fila"><dt>Cantidad disponible</dt><dd id="detalle-cantidad"></dd></div>
          <div class="detalle__fila"><dt>Stock mínimo</dt><dd id="detalle-minimo"></dd></div>
          <div class="detalle__fila"><dt>Fecha de vencimiento</dt><dd id="detalle-vencimiento"></dd></div>
          <div class="detalle__fila"><dt>Proveedor</dt><dd id="detalle-proveedor"></dd></div>
        </dl>
      </section>
      <aside class="detalle__lateral">
        <section class="panel panel--centrado">
          <h2 class="panel__titulo">Código de barras</h2>
          <div class="barras" id="detalle-barras"></div>
          <p class="codigo texto-suave" id="detalle-codigo-texto"></p>
        </section>
        <a href="editar-producto.html" id="enlace-editar" class="boton boton--primario">Editar producto</a>
        <a href="productos.html" class="boton boton--secundario">Volver al listado</a>
      </aside>
    </div>
  </main>
  <script src="js/almacenamiento.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/formato.js"></script>
  <script src="js/codigo-barras.js"></script>
  <script src="js/vista-detalle.js"></script>
</body>
</html>
